<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кликер</title>
    <style>
        /* ===== СБРОС СТИЛЕЙ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== ГЛАВНЫЙ БЛОК ===== */
        #app {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a4a;
            transition: opacity 0.5s, filter 0.5s;
        }

        #app.game-over {
            opacity: 0.4;
            filter: blur(2px);
            pointer-events: none;
        }

        #app.blocked {
            opacity: 0.5;
            filter: blur(1px);
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .subtitle {
            color: #8888aa;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .counter {
            font-size: 4.5rem;
            font-weight: bold;
            color: #ffd700;
            background: #12121f;
            border-radius: 16px;
            padding: 20px;
            margin: 10px 0 15px 0;
            border: 1px solid #2a2a4a;
            font-variant-numeric: tabular-nums;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-box {
            background: #12121f;
            border-radius: 12px;
            padding: 12px 8px;
            border: 1px solid #2a2a4a;
        }

        .stat-label {
            color: #666688;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .stat-value.gold { color: #ffd700; }
        .stat-value.green { color: #4ade80; }
        .stat-value.blue { color: #60a5fa; }
        .stat-value.pink { color: #f472b6; }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.2s;
            width: 100%;
            margin: 6px 0;
            touch-action: manipulation;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.94);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        #clickBtn {
            background: linear-gradient(145deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            font-size: 1.5rem;
            padding: 22px 20px;
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.25);
            margin-top: 10px;
        }

        #upgradeBtn {
            background: linear-gradient(145deg, #4ade80, #22c55e);
            color: #0f0f1a;
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.2);
        }

        #resetBtn {
            background: #2a2a4a;
            color: #8888aa;
            font-size: 0.95rem;
            padding: 14px 20px;
            margin-top: 10px;
            border: 1px solid #3a3a5a;
        }

        #message {
            color: #f87171;
            font-size: 0.9rem;
            min-height: 28px;
            margin: 8px 0 4px 0;
            transition: opacity 0.3s;
            opacity: 0;
        }

        #message.show {
            opacity: 1;
        }

        /* ===== ПОЗДРАВЛЕНИЕ - ПОЛНЫЙ ЭКРАН ===== */
        #celebrateOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            cursor: default;
        }

        #celebrateOverlay.show {
            display: flex;
        }

        #celebrateOverlay .content {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
            text-align: center;
        }

        #celebrateImage {
            max-width: 95vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
            display: block;
            margin: 0 auto;
        }

        #celebrateTimer {
            color: #8888aa;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            font-family: monospace;
        }

        #celebrateTimer span {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #celebrateCloseBtn {
            position: absolute;
            top: -18px;
            right: -18px;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.5);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #celebrateCloseBtn:hover {
            transform: scale(1.1);
        }

        #celebrateCloseBtn:active {
            transform: scale(0.9);
        }

        /* ===== КОНЕЦ ИГРЫ ===== */
        #gameOverOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.7s ease;
        }

        #gameOverOverlay.show {
            display: flex;
        }

        #gameOverModal {
            background: linear-gradient(145deg, #1a1a2e, #2a1a3e);
            border-radius: 24px;
            padding: 50px 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 3px solid #ffd700;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.4);
            animation: bounceIn 0.8s ease;
        }

        #gameOverModal .win-icon {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: pulse 1.2s infinite;
        }

        #gameOverModal h2 {
            color: #ffd700;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        #gameOverModal .final-stats {
            color: #aaaacc;
            font-size: 1.1rem;
            margin: 15px 0;
            line-height: 1.8;
        }

        #gameOverModal .final-stats span {
            color: #ffd700;
            font-weight: bold;
        }

        #gameOverRestartBtn {
            background: linear-gradient(145deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            border: none;
            border-radius: 14px;
            padding: 16px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        #gameOverRestartBtn:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 480px) {
            #app {
                padding: 28px 18px;
            }
            .counter {
                font-size: 3.5rem;
                padding: 15px;
            }
            h1 {
                font-size: 1.6rem;
            }
            button {
                font-size: 1rem;
                padding: 16px 16px;
            }
            #clickBtn {
                font-size: 1.2rem;
                padding: 20px 16px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-value {
                font-size: 1.1rem;
            }
            #gameOverModal h2 {
                font-size: 1.6rem;
            }
            #celebrateImage {
                max-width: 98vw;
                max-height: 65vh;
            }
            #celebrateCloseBtn {
                top: -12px;
                right: -12px;
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <h1>⚡ КЛИКЕР</h1>
        <div class="subtitle">нажимай и качай силу</div>

        <div class="counter" id="counter">0</div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">💰 Монет</div>
                <div class="stat-value gold" id="coinsDisplay">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">⚡ Сила клика</div>
                <div class="stat-value green" id="clickPowerDisplay">+1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">📈 Улучшений</div>
                <div class="stat-value blue" id="upgradeLevelDisplay">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">💎 Цена</div>
                <div class="stat-value pink" id="upgradePriceDisplay">10</div>
            </div>
        </div>

        <button id="clickBtn">👆 КЛИК</button>
        <button id="upgradeBtn">🔧 Улучшить клик</button>
        <button id="resetBtn">🔄 Сброс</button>

        <div id="message"></div>
    </div>

    <!-- ===== ПОЗДРАВЛЕНИЕ ===== -->
    <div id="celebrateOverlay">
        <div class="content">
            <img id="celebrateImage" src="monkey.jpg" alt="Поздравление" />
            <button id="celebrateCloseBtn">✕</button>
            <div id="celebrateTimer">⏳ <span id="timerSeconds">30</span> сек</div>
        </div>
    </div>

    <!-- ===== КОНЕЦ ИГРЫ ===== -->
    <div id="gameOverOverlay">
        <div id="gameOverModal">
            <div class="win-icon">🏆</div>
            <h2>ТЫ ПОБЕДИЛ!</h2>
            <div class="final-stats">
                Монет: <span id="finalCoins">0</span><br />
                Сила клика: <span id="finalPower">+1</span><br />
                Улучшений куплено: <span id="finalLevel">0</span>
            </div>
            <p style="color: #8888aa; font-size: 0.9rem; margin-bottom: 15px;">
                Ты достиг 10 000 монет и завершил игру!
            </p>
            <button id="gameOverRestartBtn">🔄 Играть заново</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  НАХОДИМ ЭЛЕМЕНТЫ
        // ============================================================
        const appEl = document.getElementById('app');
        const counterEl = document.getElementById('counter');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const clickPowerDisplay = document.getElementById('clickPowerDisplay');
        const upgradeLevelDisplay = document.getElementById('upgradeLevelDisplay');
        const upgradePriceDisplay = document.getElementById('upgradePriceDisplay');
        const clickBtn = document.getElementById('clickBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const messageEl = document.getElementById('message');

        const celebrateOverlay = document.getElementById('celebrateOverlay');
        const celebrateImage = document.getElementById('celebrateImage');
        const celebrateCloseBtn = document.getElementById('celebrateCloseBtn');
        const timerSeconds = document.getElementById('timerSeconds');

        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalCoins = document.getElementById('finalCoins');
        const finalPower = document.getElementById('finalPower');
        const finalLevel = document.getElementById('finalLevel');
        const gameOverRestartBtn = document.getElementById('gameOverRestartBtn');

        // ============================================================
        //  ПЕРЕМЕННЫЕ ИГРЫ
        // ============================================================
        let count = 0;
        let clickpower = 1;
        let upgradeprice = 10;
        let upgradelevel = 0;

        let isGameOver = localStorage.getItem('game_over') === 'true';
        let timerInterval = null;
        let celebrateTimeout = null;
        let isCelebrating = false;

        // ============================================================
        //  ЗАГРУЗКА ИЗ localStorage
        // ============================================================
        const savedCount = localStorage.getItem('clicker_count');
        if (savedCount !== null) count = parseInt(savedCount);

        const savedClickpower = localStorage.getItem('clicker_power');
        if (savedClickpower !== null) clickpower = parseInt(savedClickpower);

        const savedUpgradePrice = localStorage.getItem('clicker_price');
        if (savedUpgradePrice !== null) upgradeprice = parseInt(savedUpgradePrice);

        const savedUpgradeLevel = localStorage.getItem('clicker_level');
        if (savedUpgradeLevel !== null) upgradelevel = parseInt(savedUpgradeLevel);

        // ============================================================
        //  БЛОКИРОВКА/РАЗБЛОКИРОВКА ИГРЫ
        // ============================================================
        function blockGame() {
            appEl.classList.add('blocked');
            clickBtn.disabled = true;
            upgradeBtn.disabled = true;
        }

        function unblockGame() {
            appEl.classList.remove('blocked');
            if (!isGameOver) {
                clickBtn.disabled = false;
                upgradeBtn.disabled = false;
            }
        }

        // ============================================================
        //  ФУНКЦИЯ ОБНОВЛЕНИЯ ЭКРАНА
        // ============================================================
        function updateDisplay() {
            counterEl.textContent = count;
            coinsDisplay.textContent = count;
            clickPowerDisplay.textContent = '+' + clickpower;
            upgradeLevelDisplay.textContent = upgradelevel;
            upgradePriceDisplay.textContent = upgradeprice;

            localStorage.setItem('clicker_count', count);
            localStorage.setItem('clicker_power', clickpower);
            localStorage.setItem('clicker_price', upgradeprice);
            localStorage.setItem('clicker_level', upgradelevel);

            if (count >= 10000 && !isGameOver) {
                showGameOver();
                return;
            }

            if (count >= 5000 && !isGameOver && !isCelebrating) {
                showCelebration5000();
            }
        }

        // ============================================================
        //  ПОКАЗ СООБЩЕНИЯ
        // ============================================================
        let messageTimeout = null;

        function showMessage(text, isError = true) {
            messageEl.textContent = text;
            messageEl.style.color = isError ? '#f87171' : '#4ade80';
            messageEl.classList.add('show');

            clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        //  ПОЗДРАВЛЕНИЕ (5 000) - БЛОКИРУЕМ КЛИКИ
        // ============================================================
        function showCelebration5000() {
            if (isCelebrating) return;
            if (isGameOver) return;

            isCelebrating = true;

            // БЛОКИРУЕМ ИГРУ
            blockGame();

            // Показываем картинку
            celebrateImage.src = 'monkey.jpg';
            celebrateOverlay.classList.add('show');

            let seconds = 30;
            timerSeconds.textContent = seconds;

            if (timerInterval) clearInterval(timerInterval);
            if (celebrateTimeout) clearTimeout(celebrateTimeout);

            timerInterval = setInterval(function() {
                seconds--;
                timerSeconds.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    closeCelebration();
                }
            }, 1000);

            celebrateTimeout = setTimeout(function() {
                closeCelebration();
            }, 30000);
        }

        function closeCelebration() {
            celebrateOverlay.classList.remove('show');
            isCelebrating = false;

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (celebrateTimeout) {
                clearTimeout(celebrateTimeout);
                celebrateTimeout = null;
            }

            // РАЗБЛОКИРУЕМ ИГРУ (если не конец игры)
            if (!isGameOver) {
                unblockGame();
            }
        }

        // Закрытие по кнопке ✕
        celebrateCloseBtn.addEventListener('click', function() {
            closeCelebration();
        });

        // ============================================================
        //  КОНЕЦ ИГРЫ (10 000)
        // ============================================================
        function showGameOver() {
            if (isGameOver) return;

            // Закрываем поздравление, если открыто
            closeCelebration();

            isGameOver = true;
            localStorage.setItem('game_over', 'true');

            finalCoins.textContent = count;
            finalPower.textContent = '+' + clickpower;
            finalLevel.textContent = upgradelevel;

            appEl.classList.add('game-over');
            clickBtn.disabled = true;
            upgradeBtn.disabled = true;

            gameOverOverlay.classList.add('show');
        }

        gameOverRestartBtn.addEventListener('click', function() {
            count = 0;
            clickpower = 1;
            upgradeprice = 10;
            upgradelevel = 0;
            isGameOver = false;

            localStorage.removeItem('clicker_count');
            localStorage.removeItem('clicker_power');
            localStorage.removeItem('clicker_price');
            localStorage.removeItem('clicker_level');
            localStorage.removeItem('game_over');

            appEl.classList.remove('game-over');
            clickBtn.disabled = false;
            upgradeBtn.disabled = false;

            gameOverOverlay.classList.remove('show');

            updateDisplay();
            showMessage('🔄 Новая игра!', false);
        });

        // ============================================================
        //  ОБРАБОТЧИКИ
        // ============================================================
        clickBtn.addEventListener('click', function() {
            if (isGameOver) return;
            if (isCelebrating) return;
            count = count + clickpower;
            updateDisplay();
        });

        upgradeBtn.addEventListener('click', function() {
            if (isGameOver) return;
            if (isCelebrating) return;
            if (count >= upgradeprice) {
                count = count - upgradeprice;
                clickpower = clickpower + 1;
                upgradelevel = upgradelevel + 1;
                upgradeprice = Math.floor(upgradeprice * 1.7);
                updateDisplay();
                showMessage('✅ Улучшение куплено!', false);
            } else {
                showMessage('❌ Не хватает монет! Нужно: ' + upgradeprice);
            }
        });

        resetBtn.addEventListener('click', function() {
            if (confirm('Точно сбросить весь прогресс?')) {
                closeCelebration();
                count = 0;
                clickpower = 1;
                upgradeprice = 10;
                upgradelevel = 0;
                isGameOver = false;

                localStorage.removeItem('clicker_count');
                localStorage.removeItem('clicker_power');
                localStorage.removeItem('clicker_price');
                localStorage.removeItem('clicker_level');
                localStorage.removeItem('game_over');

                appEl.classList.remove('game-over');
                appEl.classList.remove('blocked');
                clickBtn.disabled = false;
                upgradeBtn.disabled = false;
                gameOverOverlay.classList.remove('show');

                updateDisplay();
                showMessage('🔄 Прогресс сброшен', false);
            }
        });

        // ============================================================
        //  СТАРТ
        // ============================================================
        updateDisplay();

        if (isGameOver) {
            appEl.classList.add('game-over');
            clickBtn.disabled = true;
            upgradeBtn.disabled = true;
            finalCoins.textContent = count;
            finalPower.textContent = '+' + clickpower;
            finalLevel.textContent = upgradelevel;
            gameOverOverlay.classList.add('show');
        }
    </script>

</body>
</html>
